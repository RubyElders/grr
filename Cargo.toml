[package]
name = "grr"
version = "0.2.0"
edition = "2024"
description = "A small local GUI for reviewing Git commits"
license = "MIT"
repository = "https://github.com/RubyElders/grr"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
git2 = { version = "0.21.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5" }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"

[build-dependencies]
tauri-build = { version = "2.6.2" }

[dev-dependencies]
tempfile = "3.20"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
