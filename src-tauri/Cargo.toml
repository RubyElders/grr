[package]
name = "grr"
version = "0.4.0"
edition = "2024"
rust-version = "1.90"
publish = false
description = "A small local GUI for reviewing Git commits"
license = "MIT"
repository = "https://github.com/RubyElders/grr"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
git2 = { version = "0.21.0", default-features = false }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
tauri = { version = "2.12.1", features = [] }

[target.'cfg(windows)'.dependencies]
git2 = { version = "0.21.0", default-features = false, features = ["vendored-libgit2"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"
libc = "0.2"

[build-dependencies]
tauri-build = { version = "2.7.1" }

[dev-dependencies]
tempfile = "3.20"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
