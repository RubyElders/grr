name: Set up Linux development environment
description: Install Ubuntu system dependencies, Rust and frontend dependencies

runs:
  using: composite
  steps:
    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential pkg-config curl libwebkit2gtk-4.1-dev \
          libgit2-dev libssl-dev libayatana-appindicator3-dev \
          librsvg2-dev libxdo-dev xvfb xauth dbus-daemon xdotool \
          webkitgtk-webdriver
    - name: Set up Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22.22.2
        cache: npm
    - name: Install Rust
      shell: bash
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.98.1 --component clippy,rustfmt,llvm-tools-preview
        printf '%s\n' "$HOME/.cargo/bin" >> "$GITHUB_PATH"
    - name: Install frontend dependencies
      shell: bash
      run: npm ci
