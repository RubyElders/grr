name: Set up Linux development environment
description: Install Ubuntu system dependencies, Rust and frontend dependencies

runs:
  using: composite
  steps:
    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential cmake pkg-config curl libwebkit2gtk-4.1-dev \
          libgit2-dev libssl-dev libayatana-appindicator3-dev \
          librsvg2-dev libxdo-dev xvfb xauth dbus-daemon xdotool x11-utils \
          webkitgtk-webdriver
    - name: Install libgit2 1.9.7
      shell: bash
      run: |
        git clone --depth 1 --branch v1.9.7 https://github.com/libgit2/libgit2.git "$RUNNER_TEMP/libgit2"
        test "$(git -C "$RUNNER_TEMP/libgit2" rev-parse HEAD)" = 49e408b3208bc3093757a1c2db938d3590f3f412
        cmake -S "$RUNNER_TEMP/libgit2" -B "$RUNNER_TEMP/libgit2-build" \
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local \
          -DBUILD_SHARED_LIBS=ON -DBUILD_TESTS=OFF -DBUILD_CLI=OFF \
          -DUSE_SSH=OFF -DUSE_HTTPS=OFF
        cmake --build "$RUNNER_TEMP/libgit2-build" --parallel 2
        sudo cmake --install "$RUNNER_TEMP/libgit2-build"
        sudo ldconfig
        pkg-config --atleast-version=1.9.7 libgit2
        echo "LIBGIT2_NO_VENDOR=1" >> "$GITHUB_ENV"
    - name: Set up Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 22.22.2
        cache: npm
    - name: Install Rust
      shell: bash
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.98.1 --component clippy,rustfmt,llvm-tools-preview
        printf '%s\n' "$HOME/.cargo/bin" >> "$GITHUB_PATH"
    - name: Install frontend dependencies
      shell: bash
      run: npm ci
