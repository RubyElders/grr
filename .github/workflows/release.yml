name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-26.04
            asset: grr-linux-x86_64
            extension: ''
          - platform: macOS
            runner: macos-15
            asset: grr-macos-arm64
            extension: ''
          - platform: Windows
            runner: windows-2025
            asset: grr-windows-x86_64.exe
            extension: .exe
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: 2
      RUST_BACKTRACE: 1
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.22.2
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-release-version.mjs "$RELEASE_TAG"
      - name: Set up Linux development environment
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-linux
      - name: Build Linux executable
        if: runner.os == 'Linux'
        run: npm run build:app
      - name: Check system libgit2 linkage
        if: runner.os == 'Linux'
        run: npm run check:linux
      - name: Check and build desktop executable
        if: runner.os != 'Linux'
        uses: ./.github/actions/check-desktop
        env:
          LIBGIT2_NO_PKG_CONFIG: '1'
      - name: Stage executable
        env:
          RELEASE_ASSET: ${{ matrix.asset }}
          EXECUTABLE_EXTENSION: ${{ matrix.extension }}
        run: |
          mkdir -p artifacts
          cp "src-tauri/target/release/grr$EXECUTABLE_EXTENSION" "artifacts/$RELEASE_ASSET"
      - name: Upload executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ matrix.asset }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download executables
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Write checksums
        working-directory: artifacts
        run: sha256sum grr-* > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          args=(--verify-tag --generate-notes --title "grr $RELEASE_TAG")
          if [[ "$RELEASE_TAG" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" artifacts/* "${args[@]}"
